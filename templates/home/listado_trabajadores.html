<!DOCTYPE html>
<html>
<head>
    <title>Asignación de EPP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1 class="mb-4">Listado de Trabajadores</h1>

    <div class="mb-3">
        <a class="btn btn-success" href="/">Home</a>
 
    </div>

    <h3>Trabajadores</h3>
    <table class="table table-striped">
        <thead>
            <tr>
               <th>Rut</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for t in trabajadores %}
            </tr>
                <td>{{ t.rut }}</td>
                <td>{{ t.nombre }}</td>
                <td>{{ t.apellido }}</td>
                <td>
                    <a href="{% url 'eliminar_trabajador' t.rut %}" onclick="return confirm('¿Estás seguro de eliminar este trabajador?')" class='btn btn-danger'>Eliminar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
