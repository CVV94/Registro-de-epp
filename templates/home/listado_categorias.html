<!DOCTYPE html>
<html>
<head>
    <title>Asignación de EPP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1 class="mb-4">Listado de Categorias</h1>

    <div class="mb-3">
        <a class="btn btn-success" href="/">Home</a>
 
    </div>

    <h3>Categorias de los EPP</h3>
    <table class="table table-striped">
        <thead>
            <tr>
               <th>id</th>
                <th>Nombre</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for c in categorias %}
            </tr>
                <td>{{ c.id }}</td>
                <td>{{ c.nombre }}</td>
                <td>
                    <a href="{% url 'eliminar_categoria' c.id %}" onclick="return confirm('¿Estás seguro de eliminar esta categoria?')" class='btn btn-danger'>Eliminar</a> 
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
