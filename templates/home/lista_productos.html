<!DOCTYPE html>
<html>
<head>
    <title>Asignación de EPP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1 class="mb-4">Listado de Productos</h1>

    <div class="mb-3">
        <a class="btn btn-success" href="/">Home</a>
 
    </div>

    <h3>Productos</h3>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Id</th>
                <th>Nombre</th>
                <th>Stock</th>
                <th>Talla</th>
                <th>Categoria</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for p in productos %}
            <tr>
                <td>{{ p.id }}</td>
                <td>{{ p.nombre}}</td>
                <td>{{ p.stock }}</td>
                <td>{{ p.talla }}</td>
                <td>{{ p.categoria }}</td>
                <td>
                    <a href="{% url 'eliminar_producto' p.id %}" onclick="return confirm('¿Estás seguro de eliminar este producto?')" class='btn btn-danger'>Eliminar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
